<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SSO CRM – Tablero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Menú</h2>
      <nav>
        <a href="dashboard.html">Tablero</a>
        <a href="quoting.html">Cotizador</a>
        <a href="crm.html">CRM</a>
        <a href="pipeline.html">Pipeline</a>
        <a href="worksheet.html">Hoja de trabajo</a>
        <a href="agreements.html">Convenios</a>
        <a href="admin.html">Administración</a>
        <a href="logs.html">Logs</a>
        <a href="index.html" onclick="DataStore.clearCurrentUser()">Salir</a>
      </nav>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <img src="img/logo.png" alt="Metrored logo" class="logo">
        <span class="user-info" id="user-info"></span>
      </header>
      <main class="container">
        <h2>Indicadores Clave</h2>
        <div class="kpis">
      <div class="kpi-card" data-key="totalQuotes"><h4>Cotizaciones Totales</h4><p id="kpiTotalQuotes">0</p></div>
      <div class="kpi-card" data-key="approvedQuotes"><h4>Cotizaciones Aprobadas</h4><p id="kpiApprovedQuotes">0</p></div>
      <div class="kpi-card" data-key="pendingQuotes"><h4>Cotizaciones Pendientes</h4><p id="kpiPendingQuotes">0</p></div>
      <div class="kpi-card" data-key="revenue"><h4>Ingresos Totales ($)</h4><p id="kpiRevenue">0</p></div>
      <div class="kpi-card" data-key="leads"><h4>Leads Totales</h4><p id="kpiLeads">0</p></div>
      <div class="kpi-card" data-key="tasks"><h4>Tareas Pendientes</h4><p id="kpiTasks">0</p></div>
    </div>
        <h2>Gráficas</h2>
        <div class="charts">
      <div class="chart-box" data-key="quotesByStatus"><canvas id="chartQuotes"></canvas></div>
      <div class="chart-box" data-key="marginDistribution"><canvas id="chartMargins"></canvas></div>
      <div class="chart-box" data-key="leadsByStage"><canvas id="chartLeads"></canvas></div>
      <div class="chart-box" data-key="tasksByStatus"><canvas id="chartTasks"></canvas></div>
      <div class="chart-box" data-key="revenueByMargin"><canvas id="chartRevenue"></canvas></div>
        </div>
      </main>
    </div>
  </div>
  <script src="tariff.js"></script>
  <script src="data.js"></script>
  <script src="util.js"></script>
  <script src="dashboard.js"></script>
  <script>
    // Mostrar información del usuario en la barra superior cuando DataStore esté disponible
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof DataStore !== 'undefined') {
        const currentUser = DataStore.getCurrentUser();
        const userInfoEl = document.getElementById('user-info');
        if (currentUser && userInfoEl) {
          userInfoEl.textContent = currentUser.name + ' (' + currentUser.role + ')';
        }
      }
    });
  </script>
</body>
</html>
