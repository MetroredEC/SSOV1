<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SSO CRM – Inicio de sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page" data-page="login">
  <div class="login-container">
    <img src="img/logo.png" alt="Metrored logo" class="login-logo">
    <h1>Bienvenido al CRM de Ventas SSO</h1>
    <p>Ingrese sus credenciales para comenzar</p>
    <form id="login-form" class="login-form">
      <label for="user-name">Nombre de usuario:</label>
      <input type="text" id="user-name" placeholder="Ingrese su nombre" required>
      <label for="user-password">Contraseña:</label>
      <input type="password" id="user-password" placeholder="Ingrese su contraseña" required>
      <label for="user-role">Seleccione rol:</label>
      <select id="user-role">
        <option value="seller">Vendedor</option>
        <option value="admin">Administrador</option>
        <option value="control">Control</option>
      </select>
      <button type="submit" class="btn-primary" style="width:100%; margin-top:10px;">Ingresar</button>
    </form>
  </div>
  <script src="tariff.js"></script>
  <script src="data.js"></script>
  <script src="util.js"></script>
  <script>
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', function (evt) {
      evt.preventDefault();
      const name = document.getElementById('user-name').value.trim();
      const password = document.getElementById('user-password').value;
      const role = document.getElementById('user-role').value;
      if (!name || !password) {
        UI.showError('Por favor ingrese su nombre y contraseña');
        return;
      }
      const user = DataStore.authenticateUser(name, password);
      if (!user) {
        UI.showError('Credenciales inválidas');
        return;
      }
      if (user.role !== role) {
        UI.showWarning('El rol seleccionado no coincide con sus credenciales');
        return;
      }
      // Save current user without password
      DataStore.setCurrentUser({ name: user.name, role: user.role });
      UI.showSuccess('¡Bienvenido de nuevo!');
      // Redirect based on role
      if (user.role === 'admin') {
        window.location.href = 'admin.html';
      } else if (user.role === 'control') {
        window.location.href = 'logs.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
